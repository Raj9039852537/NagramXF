name: Canary build

on:
  push:
    branches:
      - canary
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/canary.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Skip Upload: Set to "y" to skip uploading the build.'
        required: false

permissions:
  contents: read
  actions: read
  models: read

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          append-timestamp: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          # ndk must match ndkVersion in the root build.gradle
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"
      - name: Set up Python (Chaquopy bridge source build)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Install Cython (Chaquopy bridge source build)
        run: pip install Cython==3.0.11
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Canary Build
        env:
          COMMIT_ID: ${{ github.event.head_commit.id }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP=$(date +%s)
          ./gradlew TMessagesProj:assembleNormalStaging
      - uses: actions/upload-artifact@v4
        with:
          name: normal-canary
          path: TMessagesProj/build/outputs/apk/normal/staging/
          if-no-files-found: error
      - name: Install Telegram uploader
        run: |
          pip install Telethon
      - name: Upload APKs to Telegram
        if: github.event.inputs.upload != 'y' && !contains(github.event.head_commit.message, '[skip upload]')
        env:
          TELEGRAM_API_ID: ${{ secrets.APP_ID }}
          TELEGRAM_API_HASH: ${{ secrets.APP_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          COMMIT_ID: ${{ github.event.head_commit.id }}
          COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BUILD_TIMESTAMP: ${{ env.BUILD_TIMESTAMP }}
        run: |
          python - <<'PY'
          import asyncio
          import os
          import sys
          import time
          from pathlib import Path
          
          from telethon import TelegramClient
          from telethon.tl.types import PeerUser
          APK_PATH = Path(
              "TMessagesProj/build/outputs/apk/normal/staging"
          )
          ABIS = ["arm64-v8a"]
          MAX_RETRIES = 3
          RETRY_DELAY = 15
          
          def get_env(name: str, required: bool = True) -> str:
              value = os.environ.get(name, "")
          
              if required and not value:
                  raise RuntimeError(
                      f"Required environment variable is missing: {name}"
                  )
          
              return value
          
          
          API_ID = int(get_env("TELEGRAM_API_ID"))
          API_HASH = get_env("TELEGRAM_API_HASH")
          BOT_TOKEN = get_env("TELEGRAM_BOT_TOKEN").strip()
          CHAT_ID = int(get_env("TELEGRAM_CHAT_ID").strip())
          
          def find_apks() -> list[Path]:
              """
              Find APK files recursively.
          
              Prefer APKs containing one of the requested ABI names.
              If none match, fall back to all APKs.
              """
          
              if not APK_PATH.exists():
                  raise FileNotFoundError(
                      f"APK directory does not exist: {APK_PATH}"
                  )
          
              all_apks = sorted(APK_PATH.rglob("*.apk"))
          
              if not all_apks:
                  raise FileNotFoundError(
                      f"No APK files found under: {APK_PATH}"
                  )
          
              selected = [
                  apk
                  for apk in all_apks
                  if any(abi in apk.name for abi in ABIS)
              ]
          
              if selected:
                  return selected
          
              print(
                  "Warning: No APK matched requested ABI(s): "
                  + ", ".join(ABIS)
              )
          
              print("Falling back to all APKs.")
              return all_apks
          
          
          def normalize(text: str) -> str:
              return (text or "").replace("\\n", "\n")
          
          
          def commit_info():
              return (
                  (os.environ.get("COMMIT_ID") or "unknown")[:7],
                  os.environ.get("COMMIT_URL") or "",
                  os.environ.get("COMMIT_MESSAGE") or "unknown",
              )
          
          
          def caption() -> str:
              commit_id, commit_url, commit_msg = commit_info()
              ai = ""
              text = (
                  "Test version.\n\n"
                  "Commit Message:\n"
                  f"<blockquote expandable>{commit_msg}</blockquote>\n\n"
              )
          
              if commit_url:
                  text += (
                      "See commit details "
                      f'<a href="{commit_url}">{commit_id}</a>'
                  )
              else:
                  text += f"Commit: {commit_id}"
          
              if ai and len(text) + len(ai) + 30 < 1024:
                  text += (
                      "\n\n"
                      f"<blockquote expandable>{ai}</blockquote>"
                  )
          
              return text[:1024]
          
          
          def metadata() -> str:
              build_timestamp = os.environ.get(
                  "BUILD_TIMESTAMP",
                  ""
              )
          
              commit_id = os.environ.get(
                  "COMMIT_ID",
                  ""
              )[:7]
          
              commit_message = os.environ.get(
                  "COMMIT_MESSAGE",
                  ""
              )
          
              return (
                  f"<code>{build_timestamp}</code> "
                  f"<code>{commit_id}</code>\n"
                  f"<code>{commit_message}</code>"
              )
          
          
          # ============================================================
          # Telegram
          # ============================================================
          
          async def send_document(
              client: TelegramClient,
              chat_id,
              path: Path,
              caption_text: str,
          ):
              size_mb = path.stat().st_size / (
                  1024 * 1024
              )
          
              print(
                  f"Uploading {path.name} "
                  f"({size_mb:.2f} MB)..."
              )
              await client.send_file(
                  PeerUser(int(chat_id)),
                  file=str(path),
                  caption=caption_text,
                  parse_mode="html",
                  force_document=True,
              )
              print(
                  f"Successfully uploaded: {path.name}"
              )
          
          
          async def send_message(
              client: TelegramClient,
              chat_id,
              text: str,
          ):
              await client.send_message(
                  PeerUser(int(chat_id)),
                  text,
                  parse_mode="html",
              )
          
          
          # ============================================================
          # Main upload logic
          # ============================================================
          
          async def upload():
              apks = find_apks()
          
              print()
              print("APK files selected for upload:")
              for apk in apks:
                  size_mb = apk.stat().st_size / (
                      1024 * 1024
                  )
          
                  print(
                      f"  {apk.name} "
                      f"({size_mb:.2f} MB)"
                  )
          
              print()
          
              caption_text = caption()
          
              print("Connecting to Telegram using MTProto...")
          
              # Session file is created on the GitHub runner only.
              # It is not required to be stored as a GitHub secret.
              client = TelegramClient(
                  "github_canary_bot",
                  API_ID,
                  API_HASH,
              )
          
              try:
                  await client.start(
                      bot_token=BOT_TOKEN
                  )
          
                  print("Telegram connection established.")
                  print()
          
                  for apk in apks:
          
                      for attempt in range(
                          1,
                          MAX_RETRIES + 1,
                      ):
                          try:
                              print(
                                  f"Upload attempt "
                                  f"{attempt}/{MAX_RETRIES}"
                              )
          
                              await send_document(
                                  client,
                                  CHAT_ID,
                                  apk,
                                  caption_text,
                              )
          
                              break
          
                          except Exception as e:
          
                              print(
                                  f"Upload failed: {e}"
                              )
          
                              if attempt >= MAX_RETRIES:
                                  raise
          
                              print(
                                  f"Retrying in "
                                  f"{RETRY_DELAY} seconds..."
                              )
          
                              await asyncio.sleep(
                                  RETRY_DELAY
                              )
          
                  # Send metadata only after all APKs
                  # have successfully uploaded.
                  try:
                      await send_message(
                          client,
                          CHAT_ID,
                          metadata(),
                      )
          
                      print(
                          "Metadata message sent."
                      )
          
                  except Exception as e:
                      print(
                          f"Warning: APK upload succeeded "
                          f"but metadata message failed: {e}"
                      )
          
              finally:
                  await client.disconnect()
          
                  print(
                      "Disconnected from Telegram."
                  )
          
          
          # ============================================================
          # Entry point
          # ============================================================
          
          if __name__ == "__main__":
              try:
                  asyncio.run(upload())
          
              except KeyboardInterrupt:
                  print("Interrupted.")
                  sys.exit(130)
          
              except Exception as e:
                  print(
                      f"Telegram upload failed: {e}"
                  )
                  sys.exit(1)
          PY
