name: Canary build

on:
  push:
    branches:
      - canary
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/canary.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Skip Upload: Set to "y" to skip uploading the build.'
        required: false

permissions:
  contents: read
  actions: read
  models: read

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          append-timestamp: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          # ndk must match ndkVersion in the root build.gradle
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"
      - name: Set up Python (Chaquopy bridge source build)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Install Cython (Chaquopy bridge source build)
        run: pip install Cython==3.0.11
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Canary Build
        env:
          COMMIT_ID: ${{ github.event.head_commit.id }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP=$(date +%s)
          ./gradlew TMessagesProj:assembleNormalStaging
      - uses: actions/upload-artifact@v4
        with:
          name: normal-canary
          path: TMessagesProj/build/outputs/apk/normal/staging/
          if-no-files-found: error

      - name: Upload APKs to Telegram
        if: github.event.inputs.upload != 'y' && !contains(github.event.head_commit.message, '[skip upload]')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          apk_dir = pathlib.Path(
              "TMessagesProj/build/outputs/apk/normal/staging"
          )

          apks = sorted(apk_dir.rglob("*.apk"))

          if not apks:
              raise SystemExit(f"No APK files found in {apk_dir}")

          print("APK files to upload:")
          for apk in apks:
              print(f"  {apk}")

          repo = os.environ["REPO"]
          sha = os.environ["COMMIT_SHA"]
          before_sha = os.environ.get("BEFORE_SHA", "")
          head_msg = os.environ.get("HEAD_MSG", "").strip()

          if before_sha and not before_sha.startswith("000000"):
              diff_url = (
                  f"https://github.com/{repo}/compare/"
                  f"{before_sha}...{sha}"
              )
          else:
              diff_url = f"https://github.com/{repo}/commit/{sha}"

          caption = (
              "📦 Canary build\n\n"
              f"{head_msg}\n\n"
              f"Commit: {sha[:12]}\n"
              f"{diff_url}"
          )

          # Telegram caption limit
          caption = caption[:1024]

          url = f"https://api.telegram.org/bot{token}/sendDocument"

          for apk in apks:
              print(f"Uploading {apk.name}...")

              with apk.open("rb") as f:
                  response = requests.post(
                      url,
                      data={
                          "chat_id": chat_id,
                          "caption": caption,
                      },
                      files={
                          "document": (
                              apk.name,
                              f,
                              "application/vnd.android.package-archive",
                          )
                      },
                      timeout=300,
                  )

              if not response.ok:
                  print(response.text)
                  response.raise_for_status()

              result = response.json()

              if not result.get("ok"):
                  raise RuntimeError(result)

              print(f"Successfully uploaded {apk.name}")
          PY
